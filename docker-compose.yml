# Internal services — not published to host (access via Docker network only).
# Use frontend at http://localhost:3000 which proxies /api to backend.

services:
  postgres:
    image: postgres:15
    container_name: multiagent_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multiagent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7
    container_name: multiagent_redis

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: multiagent_qdrant
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multiagent_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - .env

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: multiagent_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - .env
    # Required for sandbox test containers. Treat as privileged — isolate in production.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multiagent_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
